<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trazerr Match</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
.header { background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); padding: 40px 20px; border-bottom: 1px solid #ddd; }
.header h1 { max-width: 1200px; margin: 0 auto; font-size: 32px; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.jobs-title { font-size: 20px; margin: 20px 0; font-weight: 600; }
.jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.job-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; cursor: pointer; }
.job-card:hover { border-color: #0066e0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.job-title { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
.job-meta { font-size: 13px; color: #666; margin: 0 0 10px; }
.job-desc { font-size: 13px; color: #555; margin: 0 0 10px; line-height: 1.4; }
.job-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.skill { background: #e8ecf1; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
.job-match { display: inline-block; background: #4CAF50; color: white; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>Find Your Perfect Role</h1>
</div>

<div class="container">
  <div class="jobs-title" id="title">Loading...</div>
  <div class="jobs-grid" id="jobs"></div>
</div>

<script>
// Jobs data
const jobs = [
  { id: 1, title: 'Senior Frontend Engineer', company: 'TechCorp', location: 'SF', remote: true, desc: 'Build web apps with React and TypeScript', skills: ['javascript', 'react', 'typescript'] },
  { id: 2, title: 'Product Manager', company: 'InnovateLabs', location: 'NYC', remote: true, desc: 'Drive product strategy for AI platform', skills: ['product management', 'data analysis'] },
  { id: 3, title: 'Full Stack Engineer', company: 'StartupHub', location: 'Remote', remote: true, desc: 'Build full-stack features with Node and React', skills: ['javascript', 'node.js', 'react', 'sql'] },
  { id: 4, title: 'Data Analyst', company: 'Analytics Pro', location: 'Boston', remote: false, desc: 'Start your analytics career - we train!', skills: ['sql', 'python', 'data analysis'] },
  { id: 5, title: 'DevOps Engineer', company: 'CloudSystems', location: 'Seattle', remote: true, desc: 'Architect AWS infrastructure', skills: ['aws', 'docker', 'kubernetes', 'python'] }
];

// Get skills from localStorage
let userSkills = [];
try {
  const saved = localStorage.getItem('trazerr.skills');
  if (saved) userSkills = JSON.parse(saved);
} catch (e) {}

// Calculate match
function getMatch(jobSkills) {
  if (!userSkills.length) return 0;
  const matched = jobSkills.filter(s => userSkills.some(u => u.toLowerCase().includes(s.toLowerCase()) || s.toLowerCase().includes(u.toLowerCase()))).length;
  return Math.round(matched / jobSkills.length * 100);
}

// Render
function render() {
  const titleEl = document.getElementById('title');
  const jobsEl = document.getElementById('jobs');

  titleEl.textContent = jobs.length + ' jobs available';

  jobsEl.innerHTML = jobs.map(job => `
    <div class="job-card">
      <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
        <div>
          <div class="job-title">${job.title}</div>
          <div class="job-meta">${job.company} · ${job.location}${job.remote ? ' · Remote' : ''}</div>
        </div>
        <div class="job-match">${getMatch(job.skills)}%</div>
      </div>
      <div class="job-desc">${job.desc}</div>
      <div class="job-skills">${job.skills.map(s => `<span class="skill">${s}</span>`).join('')}</div>
    </div>
  `).join('');
}

// Run immediately
render();
</script>

</body>
</html>
