<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Trazerr Match · AI Job Matching</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
.tm-page { max-width: 1200px; margin: 0 auto; padding: 40px 20px 120px; }
.tm-header { background: var(--night); padding: 60px 20px 40px; margin: -40px -20px 40px; position: relative; overflow: hidden; }
.tm-header::before { content: ''; position: absolute; top: 0; right: -20%; width: 500px; height: 500px; background: radial-gradient(circle, var(--blue-soft) 0%, transparent 70%); opacity: 0.15; z-index: 0; }
.tm-header > div { position: relative; z-index: 1; }
.tm-header h1 { margin: 0; font-size: clamp(28px, 8vw, 42px); font-weight: 800; color: var(--paper); font-family: 'Instrument Sans', sans-serif; letter-spacing: -0.02em; }
.tm-header p { margin: 12px 0 0; color: var(--ink-2); font-size: clamp(14px, 2vw, 16px); }
.tm-search-box { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
.tm-search-box input { flex: 1; min-width: 180px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--ink); font-family: inherit; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.tm-search-box input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.tm-search-box input::placeholder { color: var(--ink-2); }
.tm-search-box button { padding: 12px 28px; background: var(--blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; font-family: inherit; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.tm-search-box button:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 102, 224, 0.3); }
.tm-search-box button:active { transform: translateY(0); }
.tm-search-box button:disabled { background: var(--ink-2); cursor: not-allowed; }
.tm-results { margin-top: 30px; }
.tm-job { border: 1px solid var(--line); border-radius: 12px; padding: 24px; background: var(--surface); margin-bottom: 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.tm-job:hover { border-color: var(--blue); box-shadow: 0 8px 24px rgba(0, 102, 224, 0.1); }
.tm-job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 16px; }
.tm-job-info h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: var(--ink); font-family: 'Instrument Sans', sans-serif; }
.tm-job-meta { font-size: 13px; color: var(--ink-2); }
.tm-match-score { text-align: center; flex-shrink: 0; }
.tm-score-num { font-size: 32px; font-weight: 800; color: var(--brass); font-family: 'Instrument Sans', sans-serif; }
.tm-score-label { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.tm-job-desc { font-size: 14px; color: var(--ink); line-height: 1.6; margin-bottom: 16px; }
.tm-factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.tm-factor { padding: 12px; background: var(--paper); border: 1px solid var(--line-soft); border-radius: 8px; font-size: 12px; text-align: center; }
.tm-factor-name { font-weight: 600; color: var(--ink); margin-bottom: 6px; font-size: 11px; }
.tm-factor-score { font-size: 16px; font-weight: 700; color: var(--brass); }
.tm-error { background: var(--err); background-color: rgba(211, 47, 47, 0.1); border: 1px solid rgba(211, 47, 47, 0.3); border-radius: 8px; padding: 16px; margin-bottom: 16px; color: #c62828; font-size: 14px; }
.tm-info { background: var(--blue-soft); border: 1px solid var(--blue); border-radius: 8px; padding: 16px; margin-bottom: 16px; color: var(--ink); font-size: 14px; }
.tm-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
.tm-modal.open { display: block; }
.tm-modal-content { background: var(--surface); max-width: 600px; margin: 40px auto; border-radius: 12px; padding: 40px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.tm-modal-close { float: right; font-size: 28px; cursor: pointer; background: none; border: none; color: var(--ink-2); padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.tm-modal-close:hover { color: var(--ink); }
.tm-certificate { background: linear-gradient(135deg, var(--blue-soft) 0%, var(--paper) 100%); border: 2px solid var(--blue); border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; }
.tm-certificate h2 { margin: 0 0 8px; font-size: 20px; color: var(--ink); font-family: 'Instrument Sans', sans-serif; }
.tm-certificate p { margin: 8px 0; font-size: 14px; color: var(--ink); }
.tm-loading { text-align: center; padding: 60px 20px; color: var(--ink-2); }
.tm-loading p { margin: 0; font-size: 16px; }

@media (max-width: 640px) {
  .tm-page { padding: 20px 16px 120px; }
  .tm-header { padding: 40px 16px 30px; margin: -20px -16px 30px; }
  .tm-header::before { width: 300px; height: 300px; right: -15%; }
  .tm-search-box { gap: 10px; }
  .tm-job { padding: 16px; margin-bottom: 12px; }
  .tm-job-header { gap: 12px; }
  .tm-job-info h3 { font-size: 16px; }
  .tm-job-desc { font-size: 13px; margin-bottom: 12px; }
  .tm-factors { gap: 8px; }
  .tm-modal-content { padding: 24px; }
}

@media (prefers-color-scheme: dark) {
  .tm-header { background: linear-gradient(135deg, var(--navy) 0%, var(--night) 100%); }
}
</style>
</head>
<body>

<div class="tm-header">
  <div class="tm-page">
    <h1>Trazerr Match</h1>
    <p>Find jobs from employers and see your AI-powered compatibility</p>
  </div>
</div>

<div class="tm-page">
  <div id="error" class="tm-error" style="display: none;"></div>
  <div id="info" class="tm-info" style="display: none;"></div>

  <div class="tm-search-box">
    <input type="text" id="searchInput" placeholder="Search by company code (e.g., WM.1001) or job title...">
    <button onclick="performSearch()">Search Database</button>
    <button onclick="alert('JS works!')" style="margin-left: 8px; padding: 14px 16px; background: #666; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px;">Test</button>
  </div>

  <div id="results" class="tm-results"></div>
</div>

<!-- Detail Modal -->
<div id="modal" class="tm-modal">
  <div class="tm-modal-content">
    <button class="tm-modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let userProfile = null;

async function init() {
  try {
    const saved = localStorage.getItem('trazerr.profile.v3');
    console.log('Checking for Career DNA in localStorage:', !!saved);
    if (saved) {
      userProfile = JSON.parse(saved);
      console.log('Career DNA loaded successfully');
      showInfo('Your Career DNA is loaded. Search the job database to see compatibility scores.');
    } else {
      console.log('Career DNA not found. You can still browse all available jobs.');
      showInfo('Browse all available jobs. Build your Career DNA on the main page to see compatibility scores.');
    }

    // Auto-load all jobs
    console.log('Loading all available jobs...');
    showResults('<div class="tm-loading"><p>Loading all available jobs...</p></div>');
    await performSearch();
  } catch (e) {
    console.error('Error during init:', e);
    showError('Error: ' + e.message);
  }
}

async function performSearch() {
  console.log('performSearch called');
  const query = document.getElementById('searchInput').value.trim();
  console.log('Query:', query);

  console.log('Showing loading state...');
  showResults('<div class="tm-loading"><p>Loading jobs...</p></div>');

  try {
    const url = '/api/app?action=searchjobs&q=' + encodeURIComponent(query);
    console.log('Fetching jobs from:', url);
    const response = await fetch(url);
    console.log('Search response status:', response.status);

    if (!response.ok) {
      const text = await response.text();
      console.error('Search failed with status', response.status, ':', text);
      try {
        const data = JSON.parse(text);
        showError((data.error || data.message || 'Search failed') + ' (HTTP ' + response.status + ')');
      } catch {
        showError('Search failed: Server error (HTTP ' + response.status + '). ' + text.slice(0, 200));
      }
      return;
    }

    const data = await response.json();
    console.log('Search response:', JSON.stringify(data));
    console.log('Search returned', data.jobs?.length || 0, 'jobs');

    if (!data.jobs || data.jobs.length === 0) {
      showResults('<div class="tm-info">No jobs found. Try different keywords or check back later.</div>');
      return;
    }

    console.log('Found', data.jobs.length, 'jobs, analyzing...');
    await analyzeJobsForUser(data.jobs);
  } catch (e) {
    console.error('Search error:', e);
    showError('Search failed: ' + (e.message || String(e)));
  }
}

async function analyzeJobsForUser(jobs) {
  // If no Career DNA, just show job listings without AI matching
  if (!userProfile) {
    const results = jobs.map(job => `
      <div class="tm-job">
        <div class="tm-job-header">
          <div class="tm-job-info">
            <h3>${job.title}</h3>
            <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
          </div>
        </div>
        <div class="tm-job-desc">${job.description || 'No description available'}</div>
      </div>
    `);
    showResults('<div class="tm-results">' + results.join('') + '</div>');
    return;
  }

  showResults('<div class="tm-loading"><p>Analyzing ' + jobs.length + ' job(s) against your Career DNA...</p></div>');

  const results = [];
  for (const job of jobs) {
    try {
      const response = await fetch('/api/app?action=match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          profile: userProfile,
          job: {
            title: job.title,
            company: job.company,
            location: job.location,
            description: job.description || ''
          }
        })
      });

      if (!response.ok) {
        results.push(`
          <div class="tm-job">
            <div class="tm-job-header">
              <div class="tm-job-info">
                <h3>${job.title}</h3>
                <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
              </div>
            </div>
          </div>
        `);
        continue;
      }

      const data = await response.json();
      const fit = data.fit;
      const jobData = JSON.stringify({ title: job.title, company: job.company, location: job.location || 'Remote', description: job.description || '', job_id: job.id }).replace(/"/g, '&quot;');

      results.push(`
        <div class="tm-job" onclick="showJobDetail('${jobData}')">
          <div class="tm-job-header">
            <div class="tm-job-info">
              <h3>${job.title}</h3>
              <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
            </div>
            <div class="tm-match-score">
              <div class="tm-score-num">${fit.fitScore}%</div>
              <div class="tm-score-label">Career Fit</div>
            </div>
          </div>
          <div class="tm-job-desc">${fit.summary}</div>
          ${fit.factors && fit.factors.length > 0 ? `
            <div class="tm-factors">
              ${fit.factors.slice(0, 5).map(f => `
                <div class="tm-factor">
                  <div class="tm-factor-name">${f.name}</div>
                  <div class="tm-factor-score">${f.score}%</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `);
    } catch (e) {
      console.error('Error analyzing job:', e);
    }
  }

  showResults('<div class="tm-results">' + results.join('') + '</div>');
}

function showJobDetail(jobData) {
  try {
    const job = JSON.parse(jobData);
    const modal = document.getElementById('modal');
    modal.classList.add('open');
    document.getElementById('modalContent').innerHTML = '<div class="tm-loading"><p>Loading your fit analysis...</p></div>';

    fetch('/api/app?action=match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile: userProfile,
        job: {
          title: job.title,
          company: job.company,
          location: job.location,
          description: job.description
        }
      })
    }).then(r => r.json()).then(data => {
      const fit = data.fit;
      let factors = '';
      if (fit.factors && fit.factors.length > 0) {
        factors = '<div style="margin-top: 20px;"><h4>Your Fit Breakdown:</h4>';
        for (const f of fit.factors) {
          factors += `
            <div style="margin-bottom: 12px; padding: 12px; background: #f5f7fa; border-radius: 6px;">
              <strong>${f.name}: ${f.score}%</strong>
              <p style="margin: 4px 0 0; font-size: 13px; color: #555;">${f.note}</p>
            </div>
          `;
        }
        factors += '</div>';
      }

      document.getElementById('modalContent').innerHTML = `
        <h2>${job.title}</h2>
        <p><strong>${job.company}</strong> · ${job.location}</p>

        <div class="tm-certificate">
          <h2>Career Fit Score</h2>
          <div class="tm-score-num">${fit.fitScore}%</div>
          <p>${fit.summary}</p>
        </div>

        ${factors}

        <button onclick="closeModal()" style="margin-top: 20px; padding: 12px 24px; background: #0066e0; color: white; border: none; border-radius: 6px; cursor: pointer;">Close</button>
      `;
    }).catch(e => {
      document.getElementById('modalContent').innerHTML = '<p style="color: #d32f2f;">Error: ' + e.message + '</p><button onclick="closeModal()">Close</button>';
    });
  } catch (e) {
    console.error('Error:', e);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function showError(msg) {
  document.getElementById('error').textContent = msg;
  document.getElementById('error').style.display = 'block';
}

function showInfo(msg) {
  document.getElementById('info').textContent = msg;
  document.getElementById('info').style.display = 'block';
}

function showResults(html) {
  document.getElementById('results').innerHTML = html;
}

init();

try {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') performSearch();
    });
  }
} catch (e) {
  console.error('Error setting up search input listener:', e);
}
</script>

</body>
</html>
