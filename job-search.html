<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Trazerr Match · AI Job Matching</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
.tm-page { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.tm-header { background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); padding: 40px 20px; margin: -40px -20px 40px; }
.tm-header h1 { margin: 0; font-size: 36px; font-weight: 800; }
.tm-header p { margin: 8px 0 0; color: #666; font-size: 16px; }
.tm-search-box { display: flex; gap: 12px; margin-bottom: 30px; }
.tm-search-box input { flex: 1; padding: 14px 16px; border: 1px solid #d0d7e0; border-radius: 8px; font-size: 14px; }
.tm-search-box button { padding: 14px 28px; background: #0066e0; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
.tm-results { margin-top: 30px; }
.tm-job { border: 1px solid #d0d7e0; border-radius: 12px; padding: 24px; background: white; margin-bottom: 16px; cursor: pointer; transition: all 0.2s; }
.tm-job:hover { border-color: #0066e0; box-shadow: 0 4px 12px rgba(0,102,224,0.1); }
.tm-job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.tm-job-info h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.tm-job-meta { font-size: 14px; color: #666; }
.tm-match-score { text-align: center; }
.tm-score-num { font-size: 32px; font-weight: 800; color: #4CAF50; }
.tm-score-label { font-size: 12px; color: #999; }
.tm-job-desc { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 12px; }
.tm-factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.tm-factor { padding: 10px; background: #f5f7fa; border-radius: 6px; font-size: 12px; text-align: center; }
.tm-factor-name { font-weight: 600; color: #0e1628; margin-bottom: 4px; }
.tm-factor-score { font-size: 14px; font-weight: 700; color: #4CAF50; }
.tm-error { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 16px; margin-bottom: 16px; color: #856404; }
.tm-info { background: #d1ecf1; border: 1px solid #bee5eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; color: #0c5460; }
.tm-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; }
.tm-modal.open { display: block; }
.tm-modal-content { background: white; max-width: 700px; margin: 40px auto; border-radius: 12px; padding: 40px; }
.tm-modal-close { float: right; font-size: 28px; cursor: pointer; background: none; border: none; color: #999; }
.tm-certificate { background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); border: 2px solid #0066e0; border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; }
.tm-certificate h2 { margin: 0 0 8px; font-size: 24px; }
.tm-certificate p { margin: 8px 0; font-size: 14px; color: #555; }
.tm-loading { text-align: center; padding: 40px; color: #999; }
</style>
</head>
<body>

<div class="tm-header">
  <div class="tm-page">
    <h1>Trazerr Match</h1>
    <p>Find jobs from employers and see your AI-powered compatibility</p>
  </div>
</div>

<div class="tm-page">
  <div id="error" class="tm-error" style="display: none;"></div>
  <div id="info" class="tm-info" style="display: none;"></div>

  <div class="tm-search-box">
    <input type="text" id="searchInput" placeholder="Search by company code (e.g., WM.1001) or job title...">
    <button onclick="performSearch()">Search Database</button>
  </div>

  <div id="results" class="tm-results"></div>
</div>

<!-- Detail Modal -->
<div id="modal" class="tm-modal">
  <div class="tm-modal-content">
    <button class="tm-modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let userProfile = null;

async function init() {
  try {
    const saved = localStorage.getItem('trazerr.profile.v3');
    console.log('Checking for Career DNA in localStorage:', !!saved);
    if (!saved) {
      showInfo('Please build your Career DNA first on the main page, then return here to search jobs.');
      showResults('<div class="tm-loading"><p>Waiting for your Career DNA...</p></div>');
      console.log('Career DNA not found in localStorage. Available keys:', Object.keys(localStorage));
      return;
    }

    userProfile = JSON.parse(saved);
    console.log('Career DNA loaded successfully');
    showInfo('Your Career DNA is loaded. Search the job database by company code (WM.1001) or job title.');
  } catch (e) {
    console.error('Error loading Career DNA:', e);
    showError('Error loading your Career DNA: ' + e.message);
  }
}

async function performSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) {
    showError('Please enter a company code or job title to search.');
    return;
  }

  showResults('<div class="tm-loading"><p>Searching job database...</p></div>');

  try {
    const url = '/api/app?action=searchjobs&q=' + encodeURIComponent(query);
    console.log('Searching for:', query, 'URL:', url);
    const response = await fetch(url);
    console.log('Search response status:', response.status);

    if (!response.ok) {
      const text = await response.text();
      console.error('Search failed with status', response.status, ':', text.slice(0, 500));
      try {
        const data = JSON.parse(text);
        showError(data.error || 'Search failed (HTTP ' + response.status + ')');
      } catch {
        showError('Search failed: Server error (HTTP ' + response.status + ')');
      }
      return;
    }

    const data = await response.json();
    console.log('Search returned', data.jobs?.length || 0, 'jobs');

    if (!data.jobs || data.jobs.length === 0) {
      showResults('<div class="tm-job"><p>No jobs found matching "' + query + '". Try another search.</p></div>');
      return;
    }

    await analyzeJobsForUser(data.jobs);
  } catch (e) {
    console.error('Search error:', e);
    showError('Search failed: ' + e.message);
  }
}

async function analyzeJobsForUser(jobs) {
  // If no Career DNA, just show job listings without AI matching
  if (!userProfile) {
    const results = jobs.map(job => `
      <div class="tm-job">
        <div class="tm-job-header">
          <div class="tm-job-info">
            <h3>${job.title}</h3>
            <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
          </div>
        </div>
        <div class="tm-job-desc">${job.description || 'No description available'}</div>
      </div>
    `);
    showResults('<div class="tm-results">' + results.join('') + '</div>');
    return;
  }

  showResults('<div class="tm-loading"><p>Analyzing ' + jobs.length + ' job(s) against your Career DNA...</p></div>');

  const results = [];
  for (const job of jobs) {
    try {
      const response = await fetch('/api/app?action=match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          profile: userProfile,
          job: {
            title: job.title,
            company: job.company,
            location: job.location,
            description: job.description || ''
          }
        })
      });

      if (!response.ok) {
        results.push(`
          <div class="tm-job">
            <div class="tm-job-header">
              <div class="tm-job-info">
                <h3>${job.title}</h3>
                <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
              </div>
            </div>
          </div>
        `);
        continue;
      }

      const data = await response.json();
      const fit = data.fit;
      const jobData = JSON.stringify({ title: job.title, company: job.company, location: job.location || 'Remote', description: job.description || '', job_id: job.id }).replace(/"/g, '&quot;');

      results.push(`
        <div class="tm-job" onclick="showJobDetail('${jobData}')">
          <div class="tm-job-header">
            <div class="tm-job-info">
              <h3>${job.title}</h3>
              <div class="tm-job-meta">${job.company} · ${job.location || 'Remote'}</div>
            </div>
            <div class="tm-match-score">
              <div class="tm-score-num">${fit.fitScore}%</div>
              <div class="tm-score-label">Career Fit</div>
            </div>
          </div>
          <div class="tm-job-desc">${fit.summary}</div>
          ${fit.factors && fit.factors.length > 0 ? `
            <div class="tm-factors">
              ${fit.factors.slice(0, 5).map(f => `
                <div class="tm-factor">
                  <div class="tm-factor-name">${f.name}</div>
                  <div class="tm-factor-score">${f.score}%</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `);
    } catch (e) {
      console.error('Error analyzing job:', e);
    }
  }

  showResults('<div class="tm-results">' + results.join('') + '</div>');
}

function showJobDetail(jobData) {
  try {
    const job = JSON.parse(jobData);
    const modal = document.getElementById('modal');
    modal.classList.add('open');
    document.getElementById('modalContent').innerHTML = '<div class="tm-loading"><p>Loading your fit analysis...</p></div>';

    fetch('/api/app?action=match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile: userProfile,
        job: {
          title: job.title,
          company: job.company,
          location: job.location,
          description: job.description
        }
      })
    }).then(r => r.json()).then(data => {
      const fit = data.fit;
      let factors = '';
      if (fit.factors && fit.factors.length > 0) {
        factors = '<div style="margin-top: 20px;"><h4>Your Fit Breakdown:</h4>';
        for (const f of fit.factors) {
          factors += `
            <div style="margin-bottom: 12px; padding: 12px; background: #f5f7fa; border-radius: 6px;">
              <strong>${f.name}: ${f.score}%</strong>
              <p style="margin: 4px 0 0; font-size: 13px; color: #555;">${f.note}</p>
            </div>
          `;
        }
        factors += '</div>';
      }

      document.getElementById('modalContent').innerHTML = `
        <h2>${job.title}</h2>
        <p><strong>${job.company}</strong> · ${job.location}</p>

        <div class="tm-certificate">
          <h2>Career Fit Score</h2>
          <div class="tm-score-num">${fit.fitScore}%</div>
          <p>${fit.summary}</p>
        </div>

        ${factors}

        <button onclick="closeModal()" style="margin-top: 20px; padding: 12px 24px; background: #0066e0; color: white; border: none; border-radius: 6px; cursor: pointer;">Close</button>
      `;
    }).catch(e => {
      document.getElementById('modalContent').innerHTML = '<p style="color: #d32f2f;">Error: ' + e.message + '</p><button onclick="closeModal()">Close</button>';
    });
  } catch (e) {
    console.error('Error:', e);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function showError(msg) {
  document.getElementById('error').textContent = msg;
  document.getElementById('error').style.display = 'block';
}

function showInfo(msg) {
  document.getElementById('info').textContent = msg;
  document.getElementById('info').style.display = 'block';
}

function showResults(html) {
  document.getElementById('results').innerHTML = html;
}

init();

document.getElementById('searchInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') performSearch();
});
</script>

</body>
</html>
