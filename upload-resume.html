<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Resume - Trazerr Match</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    :root {
      --navy: #12213f;
      --blue: #165dcc;
      --red: #a8322b;
      --ink: #17233b;
      --muted: #687286;
      --paper: #f7f6f1;
      --line: #d9dce2;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      margin: 0;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: white;
      border-right: 1px solid var(--line);
      padding: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 32px;
      color: var(--navy);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 40px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: rgba(22, 93, 204, 0.05);
      color: var(--blue);
    }

    .nav-item.active {
      background: rgba(22, 93, 204, 0.1);
      color: var(--blue);
    }

    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 20px;
    }

    .logout-btn {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--red);
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #fff0eb;
      border-color: var(--red);
    }

    /* Main content */
    .content {
      padding: 40px;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--navy);
    }

    .header p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .upload-section {
      background: white;
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      margin-bottom: 40px;
      transition: all 0.2s;
    }

    .upload-section.dragover {
      border-color: var(--blue);
      background: rgba(22, 93, 204, 0.05);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .upload-section h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--navy);
      margin: 0 0 8px;
    }

    .upload-section p {
      color: var(--muted);
      margin: 0 0 24px;
    }

    .file-input {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      padding: 12px 32px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .upload-btn:hover {
      background: #1468db;
      transform: translateY(-1px);
    }

    .upload-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
      transform: none;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--navy);
    }

    .form-group textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
    }

    .status {
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      display: none;
    }

    .status.success {
      background: #e6f7e6;
      color: #1a7a1a;
      display: block;
    }

    .status.error {
      background: #ffe6e6;
      color: #a8322b;
      display: block;
    }

    .status.loading {
      background: #e6f2ff;
      color: #165dcc;
      display: block;
    }

    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--navy);
    }

    .career-dna {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
    }

    .dna-item {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .dna-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .dna-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .dna-value {
      font-size: 16px;
      color: var(--navy);
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <div class="sidebar-brand">🎯 Trazerr Match</div>
    <nav class="sidebar-nav">
      <a href="/dashboard-candidate.html" class="nav-item">📊 Dashboard</a>
      <a href="/upload-resume.html" class="nav-item active">📤 Upload Resume</a>
      <a href="/match.html" class="nav-item">💼 My Matches</a>
      <a href="/career-paths.html" class="nav-item">🗺️ Career Paths</a>
      <a href="/candidate-applications.html" class="nav-item">📝 Applications</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <div class="header">
      <h1>Upload Your Resume 📄</h1>
      <p>We'll analyze it to create your Career DNA profile</p>
    </div>

    <div class="upload-section" id="uploadSection" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
      <div class="upload-icon">📤</div>
      <h2>Upload your resume</h2>
      <p>PDF, Word, or paste as text</p>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx,.txt">
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
    </div>

    <div class="form-group">
      <label>Or paste your resume text:</label>
      <textarea id="resumeText" placeholder="Paste your resume text here..."></textarea>
    </div>

    <button class="upload-btn" onclick="analyzeResume()" id="analyzeBtn">Analyze Resume</button>

    <div id="statusMsg" class="status"></div>

    <div id="careerDnaSection" style="display: none;" class="section">
      <h2 class="section-title">Your Career DNA 🧬</h2>
      <div class="career-dna">
        <div class="dna-item">
          <div class="dna-label">Headline</div>
          <div class="dna-value" id="headline">—</div>
        </div>
        <div class="dna-item">
          <div class="dna-label">Experience</div>
          <div class="dna-value" id="experience">—</div>
        </div>
        <div class="dna-item">
          <div class="dna-label">Location</div>
          <div class="dna-value" id="location">—</div>
        </div>
        <div class="dna-item">
          <div class="dna-label">Clarity Score</div>
          <div class="dna-value" id="evidenceScore">—</div>
        </div>
        <div class="dna-item">
          <div class="dna-label">Strengths</div>
          <div id="strengths"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', () => {
  checkAuth();
});

function checkAuth() {
  const userData = sessionStorage.getItem('user');
  if (!userData) {
    window.location.href = '/signup.html';
    return;
  }
  currentUser = JSON.parse(userData);
}

function handleDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('uploadSection').classList.add('dragover');
}

function handleDragLeave(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('uploadSection').classList.remove('dragover');
}

function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('uploadSection').classList.remove('dragover');

  const files = e.dataTransfer.files;
  if (files.length > 0) {
    document.getElementById('fileInput').files = files;
  }
}

document.getElementById('fileInput').addEventListener('change', () => {
  const file = document.getElementById('fileInput').files[0];
  if (file) {
    analyzeResume();
  }
});

async function analyzeResume() {
  const file = document.getElementById('fileInput').files[0];
  const text = document.getElementById('resumeText').value.trim();

  if (!file && !text) {
    showStatus('Please upload a file or paste resume text', 'error');
    return;
  }

  const token = sessionStorage.getItem('token');
  if (!token) {
    showStatus('Please sign in first', 'error');
    return;
  }

  showStatus('Analyzing your resume...', 'loading');
  document.getElementById('analyzeBtn').disabled = true;

  try {
    let body;

    if (file) {
      // Read file as base64 for PDF
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        body = { kind: 'pdf', data: base64 };

        const response = await fetch('/api/app?action=uploadresume', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        handleAnalysisResponse(response);
      };
      reader.readAsDataURL(file);
    } else {
      // Use text
      body = { kind: 'text', text };

      const response = await fetch('/api/app?action=uploadresume', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(body)
      });

      handleAnalysisResponse(response);
    }
  } catch (err) {
    console.error('Error:', err);
    showStatus(err.message || 'Analysis failed', 'error');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

async function handleAnalysisResponse(response) {
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    showStatus(error.error || 'Analysis failed', 'error');
    document.getElementById('analyzeBtn').disabled = false;
    return;
  }

  const data = await response.json();
  const profile = data.profile;

  showStatus('Resume analyzed! Displaying your Career DNA...', 'success');

  // Display Career DNA
  document.getElementById('headline').textContent = profile.headline || '—';
  document.getElementById('experience').textContent = profile.experience || '—';
  document.getElementById('location').textContent = profile.location || '—';
  document.getElementById('evidenceScore').textContent = profile.evidenceScore + '/100';

  let strengthsHtml = '';
  if (profile.strengths && profile.strengths.length > 0) {
    strengthsHtml = profile.strengths.map(s =>
      `<div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line);">
        <div style="font-weight: 500; color: var(--navy);">${escapeHtml(s.name)}</div>
        <div style="font-size: 13px; color: var(--muted);">${escapeHtml(s.evidence)}</div>
      </div>`
    ).join('');
  }
  document.getElementById('strengths').innerHTML = strengthsHtml || 'No strengths found';

  document.getElementById('careerDnaSection').style.display = 'block';
  document.getElementById('analyzeBtn').disabled = false;

  // Clear form
  document.getElementById('fileInput').value = '';
  document.getElementById('resumeText').value = '';

  setTimeout(() => {
    document.getElementById('statusMsg').style.display = 'none';
  }, 3000);
}

function showStatus(message, type) {
  const statusEl = document.getElementById('statusMsg');
  statusEl.textContent = message;
  statusEl.className = 'status ' + type;
}

function logout() {
  sessionStorage.clear();
  window.location.href = '/signup.html';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
