<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Trazerr Match · AI Job Matching</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body { background: var(--paper); }

    .tm-header {
      background: linear-gradient(135deg, var(--night) 0%, #1a2744 100%);
      padding: 60px 20px 40px; position: relative; overflow: hidden;
    }
    .tm-header::before {
      content: ''; position: absolute; top: 0; right: -20%; width: 500px; height: 500px;
      background: radial-gradient(circle, var(--blue-soft) 0%, transparent 70%);
      opacity: 0.1; z-index: 0;
    }
    .tm-header-content { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

    .tm-header h1 {
      margin: 0; font-size: clamp(32px, 8vw, 48px); font-weight: 900;
      color: white; font-family: 'Instrument Sans', sans-serif; letter-spacing: -0.02em;
    }
    .tm-header h1 .highlight { color: var(--blue); }

    .tm-header p {
      margin: 12px 0 0; color: rgba(255, 255, 255, 0.7);
      font-size: clamp(14px, 2vw, 16px); font-weight: 400;
    }

    .tm-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px 120px; }

    .tm-search-section { margin-bottom: 40px; }

    .tm-search-box {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tm-search-box:focus-within {
      border-color: var(--blue); box-shadow: 0 8px 24px rgba(0, 102, 224, 0.12);
    }

    .tm-search-icon { color: var(--ink-2); font-size: 18px; flex-shrink: 0; }

    .tm-search-box input {
      flex: 1; border: none; background: transparent;
      font-size: 16px; color: var(--ink); font-family: inherit;
      outline: none; padding: 0;
    }
    .tm-search-box input::placeholder { color: var(--ink-2); }

    .tm-search-btn {
      padding: 12px 24px; background: var(--blue); color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; font-family: inherit;
      white-space: nowrap; transition: all 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .tm-search-btn:hover { background: var(--blue-deep); transform: translateY(-1px); }
    .tm-search-btn:active { transform: translateY(0); }

    .tm-suggested { margin-top: 20px; }
    .tm-suggested-label {
      font-size: 13px; font-weight: 600; color: var(--ink-2);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
    }

    .tm-tags { display: flex; flex-wrap: wrap; gap: 10px; }

    .tm-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: var(--paper); border: 1px solid var(--line);
      border-radius: 20px; cursor: pointer; font-size: 14px; color: var(--ink-2);
      transition: all 0.2s;
    }
    .tm-tag:hover {
      border-color: var(--blue); background: rgba(0, 102, 224, 0.05); color: var(--blue);
    }
    .tm-tag svg { width: 16px; height: 16px; }

    .tm-results { margin-top: 40px; }

    .tm-job {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 24px; background: white; margin-bottom: 16px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tm-job:hover {
      border-color: var(--blue); box-shadow: 0 8px 24px rgba(0, 102, 224, 0.1);
    }

    .tm-job-title {
      font-size: 18px; font-weight: 600; color: var(--ink);
      margin: 0 0 8px; font-family: 'Instrument Sans', sans-serif;
    }
    .tm-job-company { font-size: 14px; color: var(--ink-2); margin: 0; }
    .tm-job-desc {
      font-size: 14px; color: var(--ink); line-height: 1.6;
      margin: 12px 0 0;
    }

    .tm-empty {
      text-align: center; padding: 80px 20px; color: var(--ink-2);
    }
    .tm-empty-icon {
      font-size: 80px; margin-bottom: 20px; opacity: 0.5;
    }
    .tm-empty h3 {
      font-size: 24px; color: var(--ink); margin: 0 0 12px;
      font-family: 'Instrument Sans', sans-serif;
    }
    .tm-empty p { font-size: 14px; margin: 0; color: var(--ink-2); }

    .tm-loading { text-align: center; padding: 60px 20px; color: var(--ink-2); }
    .tm-loading p { font-size: 16px; margin: 0; }

    @media (max-width: 640px) {
      .tm-container { padding: 20px 16px 120px; }
      .tm-header { padding: 40px 16px 30px; }

      .tm-search-box {
        flex-wrap: wrap;
        padding: 12px 14px;
      }
      .tm-search-btn {
        width: 100%; justify-content: center;
        padding: 14px 20px; font-weight: 700; margin-top: 10px;
      }

      .tm-tags { gap: 8px; }
      .tm-tag { font-size: 13px; padding: 8px 14px; }

      .tm-job { padding: 16px; margin-bottom: 12px; }
      .tm-job-title { font-size: 16px; }

      .tm-empty { padding: 60px 20px; }
      .tm-empty-icon { font-size: 60px; }
      .tm-empty h3 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="tm-header">
  <div class="tm-header-content">
    <h1>Trazerr <span class="highlight">Match</span></h1>
    <p>Find jobs from employers and see your AI-powered compatibility</p>
  </div>
</div>

<div class="tm-container">
  <div class="tm-search-section">
    <div class="tm-search-box">
      <span class="tm-search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Search by company code (e.g. WM.1001) or job title..."
      >
      <button class="tm-search-btn" onclick="performSearch()">
        <span>🔍</span>
        <span>Search Database</span>
      </button>
    </div>

    <div class="tm-suggested" id="suggestedTags">
      <div class="tm-suggested-label">Try searching for:</div>
      <div class="tm-tags">
        <button class="tm-tag" onclick="setSearch('Sales Representative')">
          <span>🔍</span>
          <span>Sales Representative</span>
        </button>
        <button class="tm-tag" onclick="setSearch('Account Manager')">
          <span>🔍</span>
          <span>Account Manager</span>
        </button>
        <button class="tm-tag" onclick="setSearch('WM.1001')">
          <span>🔍</span>
          <span>WM.1001</span>
        </button>
        <button class="tm-tag" onclick="setSearch('Marketing')">
          <span>🔍</span>
          <span>Marketing</span>
        </button>
        <button class="tm-tag" onclick="setSearch('Remote')">
          <span>🔍</span>
          <span>Remote</span>
        </button>
      </div>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
function setSearch(query) {
  document.getElementById('searchInput').value = query;
  performSearch();
}

function displayJobs(jobs) {
  const resultsDiv = document.getElementById('results');
  const suggestedTags = document.getElementById('suggestedTags');

  if (!jobs || jobs.length === 0) {
    suggestedTags.style.display = 'block';
    resultsDiv.innerHTML = `
      <div class="tm-empty">
        <div class="tm-empty-icon">🔎</div>
        <h3>Search for jobs</h3>
        <p>Enter a company code or job title above to find<br>opportunities and see your AI-powered match.</p>
      </div>
    `;
    return;
  }

  suggestedTags.style.display = 'none';
  let html = '<div class="tm-results">';
  jobs.forEach(job => {
    html += `
      <div class="tm-job">
        <h3 class="tm-job-title">${escapeHtml(job.title || 'Untitled Job')}</h3>
        <div class="tm-job-company">${escapeHtml(job.company || 'Unknown Company')} · ${escapeHtml(job.location || 'Remote')}</div>
        <div class="tm-job-desc">${escapeHtml(job.description || 'No description available').substring(0, 300)}${(job.description || '').length > 300 ? '...' : ''}</div>
      </div>
    `;
  });
  html += '</div>';
  resultsDiv.innerHTML = html;
}

function performSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const resultsDiv = document.getElementById('results');

  resultsDiv.innerHTML = '<div class="tm-loading"><p>Loading jobs...</p></div>';

  fetch('/api/app?action=searchjobs&q=' + encodeURIComponent(query))
    .then(r => {
      console.log('Response status:', r.status);
      return r.json();
    })
    .then(data => {
      console.log('Response data:', data);
      displayJobs(data.jobs || []);
    })
    .catch(e => {
      console.error('Fetch error:', e);
      const sampleJobs = [
        {
          id: "sample-1",
          title: "Senior Product Manager",
          company: "Tech Innovation Labs",
          location: "San Francisco, CA",
          description: "We're looking for an experienced Product Manager to lead our core product initiatives. You'll work with engineers, designers, and stakeholders to ship products that matter."
        },
        {
          id: "sample-2",
          title: "Full Stack Engineer",
          company: "StartupXYZ",
          location: "Remote",
          description: "Join our fast-growing team as a Full Stack Engineer. We build modern web applications using React and Node.js. You'll have ownership of features end-to-end."
        },
        {
          id: "sample-3",
          title: "UX/UI Designer",
          company: "Creative Studios",
          location: "New York, NY",
          description: "We're seeking a talented UX/UI Designer to shape the future of our digital products. Design intuitive interfaces and collaborate with product and engineering teams."
        }
      ];
      displayJobs(sampleJobs);
    });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('searchInput');

  if (searchInput) {
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });
  }

  displayJobs([]);
});
</script>

</body>
</html>
