<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post a Job · Trazerr for employers</title>
<meta name="description" content="Post a job and let AI automatically extract the required skills.">
<meta name="theme-color" content="#FFFFFF">
<script>(function(){
  var root=document.documentElement, t="light";
  try{t=localStorage.getItem("trazerr.theme")==="dark"?"dark":"light"}catch(e){}
  root.dataset.theme=t;
  if(t==="dark")document.querySelector('meta[name="theme-color"]').content="#0E1628";
  root.dataset.design="1";
})()</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { padding: 20px; }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { margin-top: 0; }
  textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: 14px; }
  .skills-display { margin-top: 24px; padding: 16px; background: var(--bg-2); border-radius: 8px; border: 1px solid var(--border); }
  .skill-tag { display: inline-block; padding: 6px 12px; background: var(--blue-light); color: var(--blue); border-radius: 20px; font-size: 13px; margin: 4px; font-weight: 500; }
  .error { padding: 12px; background: #fee; color: #c00; border-radius: 6px; margin: 16px 0; border: 1px solid #fcc; }
  .success { padding: 12px; background: #efe; color: #060; border-radius: 6px; margin: 16px 0; border: 1px solid #cfc; }
  button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .section { margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Post a Job</h1>
  <p style="color: var(--ink-2);">Paste your job description below. Our AI will automatically extract required skills and nice-to-have qualifications.</p>

  <div id="errorMsg" class="error" style="display: none;"></div>
  <div id="successMsg" class="success" style="display: none;"></div>

  <div class="section">
    <label for="jobDesc" style="display: block; font-weight: 600; margin-bottom: 8px;">Job Description</label>
    <textarea id="jobDesc" placeholder="Paste your job description here..."></textarea>
  </div>

  <div class="section">
    <label for="jobTitle" style="display: block; font-weight: 600; margin-bottom: 8px;">Job Title</label>
    <input type="text" id="jobTitle" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" placeholder="e.g., Senior React Developer">
  </div>

  <div class="section">
    <label for="location" style="display: block; font-weight: 600; margin-bottom: 8px;">Location (optional)</label>
    <input type="text" id="location" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" placeholder="e.g., New York, NY">
  </div>

  <div class="section">
    <label style="display: flex; align-items: center; font-weight: 600;">
      <input type="checkbox" id="remoteOk" style="margin-right: 8px; width: auto;">
      Remote OK
    </label>
  </div>

  <button class="btn-primary" id="extractBtn" onclick="extractAndPost()">Extract Skills & Post Job</button>
  <button onclick="document.getElementById('jobDesc').value=''; document.getElementById('jobTitle').value=''; document.getElementById('location').value=''; document.getElementById('remoteOk').checked=false; document.getElementById('skillsDisplay').innerHTML=''; document.getElementById('errorMsg').style.display='none';" style="margin-left: 8px; background: var(--border); color: var(--ink);">Clear</button>

  <div id="skillsDisplay"></div>
</div>

<script src="/assets/post-job.js"></script>
</body>
</html>
