<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post a Job · Trazerr</title>
<meta name="description" content="Post a job and let AI automatically extract the required skills.">
<meta name="theme-color" content="#FFFFFF">
<script>(function(){
  var root=document.documentElement, t="light";
  try{t=localStorage.getItem("trazerr.theme")==="dark"?"dark":"light"}catch(e){}
  root.dataset.theme=t;
  if(t==="dark")document.querySelector('meta[name="theme-color"]').content="#0E1628";
  root.dataset.design="1";
})()</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  * { box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    padding: 20px;
    margin: 0;
  }

  .page-wrapper {
    max-width: 900px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    padding-top: 20px;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 700;
    margin: 0 0 12px;
    background: linear-gradient(135deg, var(--blue) 0%, #0066E0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .header p {
    color: var(--ink-2);
    font-size: 16px;
    margin: 0;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  .form-container {
    background: var(--bg-2);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 40px;
    box-shadow: 0 4px 32px rgba(0, 102, 224, 0.08);
    margin-bottom: 24px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }

  .form-row.full {
    grid-template-columns: 1fr;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group input,
  .form-group textarea {
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 102, 224, 0.1);
  }

  .form-group textarea {
    min-height: 160px;
    resize: vertical;
    font-family: inherit;
  }

  .form-group.checkbox {
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .form-group.checkbox input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--blue);
  }

  .form-group.checkbox label {
    margin-bottom: 0;
    text-transform: none;
    letter-spacing: normal;
    cursor: pointer;
  }

  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(0, 102, 224, 0.02);
  }

  .upload-area:hover {
    border-color: var(--blue);
    background: rgba(0, 102, 224, 0.05);
  }

  .upload-area input {
    display: none;
  }

  .upload-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }

  .upload-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .upload-hint {
    font-size: 12px;
    color: var(--ink-2);
  }

  .file-list {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .file-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--blue-light);
    color: var(--blue);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .file-tag button {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    padding: 0;
    font-size: 14px;
    line-height: 1;
  }

  .button-group {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }

  .btn {
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--blue) 0%, #0066E0 100%);
    color: white;
    flex: 1;
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 102, 224, 0.3);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--bg-3);
  }

  .error {
    padding: 14px 16px;
    background: rgba(200, 0, 0, 0.08);
    color: #c00;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #c00;
    font-size: 14px;
    line-height: 1.5;
  }

  .success {
    padding: 20px;
    background: rgba(34, 197, 94, 0.08);
    color: rgb(34, 197, 94);
    border-radius: 12px;
    margin-bottom: 24px;
    border-left: 4px solid rgb(34, 197, 94);
    font-weight: 500;
  }

  .skills-display {
    background: var(--bg-2);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 28px;
    margin-top: 24px;
  }

  .skills-section {
    margin-bottom: 20px;
  }

  .skills-section:last-child {
    margin-bottom: 0;
  }

  .skills-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-2);
    margin-bottom: 12px;
  }

  .skill-tag {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    background: linear-gradient(135deg, rgba(0, 102, 224, 0.1) 0%, rgba(0, 102, 224, 0.05) 100%);
    color: var(--blue);
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    margin: 4px 4px 4px 0;
    border: 1px solid var(--blue-light);
  }

  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0, 102, 224, 0.2);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .company-badge {
    display: inline-block;
    padding: 6px 12px;
    background: var(--blue-light);
    color: var(--blue);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 12px;
  }

  @media (max-width: 600px) {
    .form-container { padding: 20px; }
    .form-row { grid-template-columns: 1fr; gap: 16px; }
    .header h1 { font-size: 28px; }
    .button-group { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page-wrapper">
  <div id="loadingMsg" style="text-align: center; padding: 40px; color: var(--ink-2);">
    Loading job posting form...
  </div>

  <div class="header" id="header" style="display: none;">
    <h1>✨ Post a Job</h1>
    <p>Let AI analyze your job description and automatically extract required skills</p>
  </div>

  <div id="errorMsg" class="error" style="display: none;"></div>
  <div id="successMsg" class="success" style="display: none;"></div>

  <div class="form-container" id="formContainer" style="display: none;">
    <div class="form-row full">
      <div class="form-group">
        <label for="jobTitle">Job Title *</label>
        <input type="text" id="jobTitle" placeholder="e.g., Senior React Developer" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g., San Francisco, CA">
      </div>
      <div class="form-group checkbox">
        <input type="checkbox" id="remoteOk">
        <label for="remoteOk">Remote-friendly position</label>
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label for="jobDesc">Job Description *</label>
        <textarea id="jobDesc" placeholder="Paste your complete job description here. Include responsibilities, requirements, nice-to-haves, and what success looks like..." required></textarea>
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label>Attach Job Posting Document (Optional)</label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📄</div>
          <div class="upload-text">Click to upload or drag & drop</div>
          <div class="upload-hint">PDF, Word (.docx), or text file</div>
          <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.txt" onchange="handleFileSelect(event)">
          <div class="file-list" id="fileList"></div>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" id="extractBtn" onclick="extractAndPost()">
        <span id="btnText">✨ Extract Skills & Post Job</span>
      </button>
      <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div id="skillsDisplay"></div>
</div>

<script src="/assets/post-job.js"></script>
</body>
</html>
