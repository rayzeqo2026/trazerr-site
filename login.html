<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - Trazerr Match</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    :root {
      --navy: #12213f;
      --blue: #165dcc;
      --red: #a8322b;
      --ink: #17233b;
      --muted: #687286;
      --paper: #f7f6f1;
    }

    body {
      background: var(--paper);
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 0;
    }

    .auth-container {
      max-width: 420px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .auth-card {
      background: white;
      border: 1px solid #d9dce2;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--navy);
    }

    .auth-header p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--ink);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d9dce2;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 93, 204, 0.1);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #144bb8;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .auth-footer p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 12px;
    }

    .auth-footer a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .forgot-password {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Sign In</h1>
        <p>Welcome back to Trazerr Match</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="forgot-password">
          <a href="/reset-password.html">Forgot password?</a>
        </div>

        <button type="submit" id="loginButton">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup.html">Create one</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

    const SUPABASE_URL = localStorage.getItem('supabaseUrl') || 'https://gkeykkisawohugfwptvr.supabase.co';
    const SUPABASE_ANON_KEY = localStorage.getItem('supabaseAnonKey') || 'sb_publishable_k9JIOb9EqAUq-c95C2lUfg_Ep7SB4Wp';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const errorMessage = document.getElementById('errorMessage');

    // Check if user is already logged in
    window.addEventListener('load', () => {
      const token = sessionStorage.getItem('access_token');
      if (token) {
        window.location.href = '/dashboard-candidate.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.remove('show');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Email and password are required');
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'Signing in...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showError(error.message || 'Invalid email or password');
          return;
        }

        if (data.session) {
          // Save session to sessionStorage
          sessionStorage.setItem('access_token', data.session.access_token);
          sessionStorage.setItem('user_id', data.user.id);
          sessionStorage.setItem('user_email', data.user.email);

          // Get user role from candidates/employers table
          const { data: candidate } = await supabase
            .from('candidates')
            .select('id')
            .eq('id', data.user.id)
            .single();

          if (candidate) {
            sessionStorage.setItem('user_role', 'candidate');
            window.location.href = '/dashboard-candidate.html';
          } else {
            const { data: employer } = await supabase
              .from('employers')
              .select('id')
              .eq('id', data.user.id)
              .single();

            if (employer) {
              sessionStorage.setItem('user_role', 'employer');
              window.location.href = '/dashboard-employer.html';
            } else {
              showError('User profile not found. Please sign up.');
            }
          }
        }
      } catch (err) {
        showError(err.message || 'Sign in failed. Please try again.');
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Sign In';
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }
  </script>
</body>
</html>
